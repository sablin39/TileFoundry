<g font-family="Arial, sans-serif" fill="#14243a">
<text x="30" y="37" font-size="23" fill="#14243a">Can the weight gradient be deferred safely?</text>
<text x="30" y="65" font-size="14" fill="#14243a">The hidden activation and gate/up activation gradient reuse one scratch range. Time is in dependency ticks.</text>
