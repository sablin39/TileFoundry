<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="838" viewBox="0 0 1240 838" role="img" aria-labelledby="title desc">
<title id="title">One token through three expert dispatchers</title><desc id="desc">Eight selected experts share two destination ranks. The diagram counts logical activation rows and shows where the backward reductions run.</desc>
