<text x="54.00" y="218" font-size="15" font-weight="700" fill="#99542f" text-anchor="start">r1  ·  same node</text>
<text x="315.00" y="218" font-size="15" font-weight="700" fill="#3a755b" text-anchor="start">r2  ·  other node</text>
<text x="641.00" y="170" font-size="20" font-weight="700" fill="#20333e" text-anchor="start">Eight expert MLPs run in every plan.</text>
<text x="641.00" y="196" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">The plans differ in which rows cross an ownership boundary</text>
<text x="641.00" y="219" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">and where the token’s weighted contributions are reduced.</text>
<text x="45.00" y="290" font-size="16" font-weight="700" fill="#465e69" text-anchor="start">Protocol</text>
<text x="252.00" y="290" font-size="16" font-weight="700" fill="#465e69" text-anchor="start">Activation dispatch</text>
<text x="570.00" y="290" font-size="16" font-weight="700" fill="#465e69" text-anchor="start">Expert output and combine</text>
<text x="960.00" y="290" font-size="16" font-weight="700" fill="#465e69" text-anchor="start">Activation payload¹</text>
