<text x="262.00" y="607" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Two rows fan out locally to eight expert computations.</text>
<text x="750.00" y="607" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Each expert GPU weights and combines its outputs.</text>
<text x="1240.00" y="575" font-size="23" font-weight="700" fill="#20333e" text-anchor="start">28 KiB</text>
