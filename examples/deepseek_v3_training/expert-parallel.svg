<text x="387.00" y="701" font-size="15" font-weight="700" fill="#246984" text-anchor="middle">Source GPU 0 publishes the row</text>
<text x="262.00" y="735" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Gate/up projection gathers each tile by source address.</text>
<text x="750.00" y="700" font-size="16" font-weight="700" fill="#20333e" text-anchor="start">Down projection writes to each original token slot.</text>
<text x="750.00" y="735" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Source GPU 0 weights and sums the completed outputs.</text>
<text x="1240.00" y="700" font-size="18" font-weight="700" fill="#20333e" text-anchor="start">8 addressed reads</text>
<text x="1240.00" y="733" font-size="17" font-weight="400" fill="#465e69" text-anchor="start">8 output writes</text>
<rect x="34.00" y="779.00" width="1432.00" height="222.00" fill="#eff3ef" rx="12" stroke="none"/>
<text x="54.00" y="816" font-size="24" font-weight="700" fill="#20333e" text-anchor="start">bwd · output gradients travel out and input gradients return</text>
<text x="54.00" y="854" font-size="18" font-weight="700" fill="#20333e" text-anchor="start">Naive / peer</text>
<text x="233.00" y="854" font-size="17" font-weight="400" fill="#20333e" text-anchor="start">Source GPU 0 weights an output gradient per expert slot, then sums the returning input gradients.</text>
<text x="54.00" y="892" font-size="18" font-weight="700" fill="#20333e" text-anchor="start">Compact</text>
<text x="233.00" y="892" font-size="17" font-weight="400" fill="#20333e" text-anchor="start">Each destination receives one output gradient, weights its expert slots and sums their input gradients locally.</text>
<text x="233.00" y="924" font-size="17" font-weight="400" fill="#20333e" text-anchor="start">Selected-score gradients also return to the source GPU.</text>
<text x="54.00" y="970" font-size="18" font-weight="700" fill="#465e69" text-anchor="start">Expert owners accumulate the gate/up and down weight gradients in every plan.</text>
<text x="40.00" y="1040" font-size="16" font-weight="400" fill="#465e69" text-anchor="start">Payloads count activation data in one direction. Scores, indices and protocol overhead need separate accounting.</text>
<text x="40.00" y="1064" font-size="16" font-weight="400" fill="#465e69" text-anchor="start">Peer reads and writes count logical accesses. Their physical traffic depends on the implementation and fabric.</text>
