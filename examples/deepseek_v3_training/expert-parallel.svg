<text x="607.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r1</text>
<rect x="622.00" y="323.00" width="23.00" height="22.00" fill="#99542f"/>
<text x="633.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r1</text>
<rect x="648.00" y="323.00" width="23.00" height="22.00" fill="#99542f"/>
<text x="659.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r1</text>
<rect x="674.00" y="323.00" width="23.00" height="22.00" fill="#3a755b"/>
<text x="685.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<rect x="700.00" y="323.00" width="23.00" height="22.00" fill="#3a755b"/>
<text x="711.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<rect x="726.00" y="323.00" width="23.00" height="22.00" fill="#3a755b"/>
<text x="737.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<rect x="752.00" y="323.00" width="23.00" height="22.00" fill="#3a755b"/>
<text x="763.50" y="339" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<text x="570.00" y="369" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Return eight Y rows. r0 weights and sums.</text>
<text x="960.00" y="345" font-size="18" font-weight="700" fill="#20333e" text-anchor="start">8 × 14 = 112 KiB</text>
<rect x="252.00" y="432.00" width="56.00" height="22.00" fill="#99542f"/>
<text x="280.00" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">r1</text>
<rect x="311.00" y="432.00" width="56.00" height="22.00" fill="#3a755b"/>
<text x="339.00" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<text x="252.00" y="478" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Two rows fan out to eight experts.</text>
<rect x="570.00" y="432.00" width="56.00" height="22.00" fill="#99542f"/>
<text x="598.00" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">r1</text>
<rect x="629.00" y="432.00" width="56.00" height="22.00" fill="#3a755b"/>
<text x="657.00" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">r2</text>
<text x="570.00" y="478" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Weight and sum locally. r0 adds two rows.</text>
<text x="960.00" y="454" font-size="18" font-weight="700" fill="#20333e" text-anchor="start">2 × 14 = 28 KiB</text>
<rect x="252.00" y="540.00" width="121.00" height="26.00" fill="#dcebf0"/>
<text x="312.00" y="558" font-size="14" font-weight="700" fill="#246984" text-anchor="middle">r0 publishes X</text>
<text x="252.00" y="588" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">W13 gathers by (rank, row).</text>
<text x="570.00" y="555" font-size="16" font-weight="700" fill="#20333e" text-anchor="start">W2 writes to eight origin slots.</text>
<text x="570.00" y="588" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">r0 weights and sums after peer writes finish.</text>
<text x="960.00" y="554" font-size="17" font-weight="700" fill="#20333e" text-anchor="start">8 addressed reads</text>
<text x="960.00" y="581" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">8 route writes</text>
<rect x="34.00" y="634.00" width="1172.00" height="131.00" fill="#f0f3ef"/>
<text x="54.00" y="665" font-size="20" font-weight="700" fill="#20333e" text-anchor="start">Read the routes backward</text>
<text x="54.00" y="695" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Naive and peer-addressed paths weight dY per slot at r0. The token owner sums returning dX contributions.</text>
<text x="54.00" y="722" font-size="16" font-weight="400" fill="#20333e" text-anchor="start">Compact dispatch sends dY once per owner. Each owner weights expert rows, adds their dX locally and returns selected-score gradients.</text>
<text x="54.00" y="748" font-size="15" font-weight="700" fill="#465e69" text-anchor="start">Every plan accumulates W13 and W2 gradients at the expert and produces one dX per source token.</text>
<text x="40.00" y="805" font-size="15" font-weight="400" fill="#465e69" text-anchor="start">¹ Payload for one direction of forward in this route. Counts exclude scores, indices and protocol overhead. Peer addresses count logical accesses.</text>
</g></svg>
