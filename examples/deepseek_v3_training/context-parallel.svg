<text x="40.00" y="747" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">¹ Ulysses / ring, across one CP group in forward. One projection expands one token block for all heads.</text>
<text x="40.00" y="777" font-size="15" font-weight="400" fill="#465e69" text-anchor="start">The ring sends 512 latent + 64 positional values per token. Backward includes the final gradient-only hop home.</text>
<rect x="34.00" y="799.00" width="1172.00" height="62.00" fill="#f0f3ef"/>
<text x="52.00" y="824" font-size="17" font-weight="700" fill="#20333e" text-anchor="start">Same compact KV, all-gather control at CP 4: 0.84 GiB forward and 0.84 GiB backward.</text>
<text x="52.00" y="847" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Each query rank retains all four blocks and reduce-scatters their gradients. The ring consumes successive blocks and replays them in backward.</text>
