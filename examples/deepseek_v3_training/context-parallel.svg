<text x="638.00" y="361" font-size="16" font-weight="700" fill="#20333e" text-anchor="start">×  Future block travels onward. Its math is skipped.</text>
<text x="638.00" y="388" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Merge row maxima, normalizers and value sums as blocks arrive.</text>
<text x="638.00" y="414" font-size="15" font-weight="400" fill="#20333e" text-anchor="start">Backward replays KV and returns each summed dKV to its owner.</text>
